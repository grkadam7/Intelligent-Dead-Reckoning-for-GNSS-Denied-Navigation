name: idr_mobile
description: Intelligent Dead Reckoning (IDR-INS) Mobile Navigation Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1
  sensors_plus: ^7.1.1
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/regions/manifest.json
    - assets/regions/urban_route.geojson
    - assets/replay/navigation.json

